[metadata]
name = "dotfiles"
description = "A channel to select from your user's dotfiles"
requirements = [ "fd", "bat",]

[source]
command = "chezmoi managed -p absolute -i files -x templates"

[preview]
command = "bat -n --color=always {}"

[keybindings]
enter = "actions:edit"

[actions.edit]
description = "Edit the selected dotfile"
command = "${EDITOR:-nvim} '{}'"
shell = "bash"
mode = "execute"

